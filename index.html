<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mboa Market</title>

    <!--Gestion du css-->
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!--Entete de page-->
    <header id="entete">
        <div class="container">
            <div id="logo">
                <a href="#">
                    Mboa<span>Market</span>
                </a>
            </div>
            
            <div id="menu">
                <a href="#" id="btn_panier"> 
                    Panier 
                    <span> <i class="fa-solid fa-cart-shopping"></i></span>
                    <span id="nb_articles" class="hide"> 0 </span>
                </a>
            </div>
        </div>
    </header>

    <!--Conteneur de la page-->
    <main id="container">

        <!--Section carrousel-->
        <section id="carrousel">
            
        </section>

        <!--SECTION POUR LA BOUTIQUE-->
        <section id="boutique">
            <div class="boutique_entete">
                <h2>Nos produits du marché </h2>
                <p id="nb_resultats"> </p>
            </div>

            <!--Filtre de recherche de produits-->
            <div class="boutique_outils">
                <div class="recherche">
                    <i class="fa-solid fa-magnifying-glass"> </i>
                    <input type="search" id="recherche" placeholder="Rechercher : poivre blanc, oigons..."/> 
                </div>
            
               <select id="tri">
                 <option value="default">
                    Trier par : recommandés
                 </option>
                 <option value="prix_croissant">
                    Prix croissant
                 </option>
                 <option value="prix_decroissant">
                    Prix décroissant
                 </option>
                 <option value="nom">
                    Nom (A -> Z)
                 </option>
               </select>

            </div>

            <!--Liste des categories -->
            <div id="categories">

            </div>
            
            <!--Liste de produits-->
            <div id="produits"> 

            </div>

        </section>
    </main> 


    <!--Pied de page-->
    <footer id="pied"> 
        <p>
            <b>Mboa <span>Market</span></b>
            Le goût du pays livré chez-vous.
        </p>

        <p>
            Tel : 683 77 73 99 | Email : mboa@market.com
        </p>
    </footer>

    <!--Gestion du javascript-->
    <script type="text/javascript" src="js/carrousel.js"></script>
    <script type="text/javascript" src="js/script.js"></script>
    <script type="text/javascript" src="js/boutique.js"></script>

</body>
</html>
